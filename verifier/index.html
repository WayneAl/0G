<title>Seal Chain Verifier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"
        integrity="sha512-FDcVY+g7vc5CXANbrTSg1K5qLyriCsGDYCE02Li1tXEYdNQPvLPHNE+rT2Mjei8N7fZbe0WLhw27j2SrGRpdMg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<style>
:root {
  --ground: #ffffff;
  --surface: #f1f4f8;
  --surface-2: #e7ecf3;
  --line: #dbe1ea;
  --ink: #131a24;
  --muted: #5a6779;
  --accent: #3d2fbf;
  --accent-soft: #ebe9fb;
  --pass: #0b7355;
  --pass-soft: #e2f2ec;
  --fail: #ae2230;
  --fail-soft: #fbe8e9;
  --warn: #8a5d08;
  --warn-soft: #fbf1dd;

  --sans: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --display: "Archivo", var(--sans);
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0e1218;
    --surface: #161c25;
    --surface-2: #1d242f;
    --line: #28313d;
    --ink: #e4e9f0;
    --muted: #8b98a9;
    --accent: #9186ff;
    --accent-soft: #1e1d3a;
    --pass: #3cbf95;
    --pass-soft: #102a24;
    --fail: #f0656e;
    --fail-soft: #2e1519;
    --warn: #d9a548;
    --warn-soft: #2a2113;
  }
}
:root[data-theme="dark"] {
  --ground: #0e1218;
  --surface: #161c25;
  --surface-2: #1d242f;
  --line: #28313d;
  --ink: #e4e9f0;
  --muted: #8b98a9;
  --accent: #9186ff;
  --accent-soft: #1e1d3a;
  --pass: #3cbf95;
  --pass-soft: #102a24;
  --fail: #f0656e;
  --fail-soft: #2e1519;
  --warn: #d9a548;
  --warn-soft: #2a2113;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
code, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.masthead {
  border-bottom: 1px solid var(--line);
  padding: 22px 28px 18px;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 8px 18px;
}
.masthead h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.masthead .sub { color: var(--muted); font-size: 13.5px; max-width: 62ch; }

.wrap {
  display: grid;
  grid-template-columns: minmax(280px, 340px) minmax(0, 1fr);
  gap: 0;
  align-items: start;
}
@media (max-width: 880px) { .wrap { grid-template-columns: 1fr; } }

.rail {
  border-right: 1px solid var(--line);
  padding: 24px 22px 40px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  position: sticky;
  top: 0;
}
@media (max-width: 880px) { .rail { position: static; border-right: none; border-bottom: 1px solid var(--line); } }

.eyebrow {
  font-family: var(--display);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--muted);
}

.samples { display: flex; flex-direction: column; gap: 8px; }
.sample {
  width: 100%;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 3px solid var(--line);
  border-radius: 3px;
  padding: 11px 13px;
  cursor: pointer;
  font: inherit;
  color: inherit;
  transition: border-color .12s, background .12s;
}
.sample:hover { background: var(--surface-2); }
.sample:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sample[aria-pressed="true"] { border-left-color: var(--accent); background: var(--surface-2); }
.sample .t { font-weight: 600; font-size: 13.5px; display: block; }
.sample .d { color: var(--muted); font-size: 12.5px; display: block; margin-top: 2px; }

textarea {
  width: 100%;
  min-height: 150px;
  resize: vertical;
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 11px 12px;
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.5;
}
textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

button.go {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 3px;
  padding: 10px 16px;
  font-family: var(--display);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
}
:root[data-theme="dark"] button.go, :root:not([data-theme="light"]) button.go { color: #0e1218; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) button.go { color: #fff; } }
button.go:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.report { padding: 24px 28px 64px; min-width: 0; }

.verdict {
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 16px 18px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px 16px;
  align-items: baseline;
  margin-bottom: 26px;
}
.verdict.ok { background: var(--pass-soft); border-color: var(--pass); }
.verdict.bad { background: var(--fail-soft); border-color: var(--fail); }
.verdict.idle { background: var(--surface); }
.verdict h2 { font-size: 17px; font-weight: 700; }
.verdict.ok h2 { color: var(--pass); }
.verdict.bad h2 { color: var(--fail); }
.verdict p { margin: 0; color: var(--muted); font-size: 13.5px; }

/* The chain is drawn as containment, because containment is the claim. */
.seal {
  border: 1px solid var(--line);
  border-radius: 3px;
  background: var(--surface);
  overflow: hidden;
}
.seal + .seal { margin-top: 18px; }
.seal-head {
  padding: 13px 16px;
  border-bottom: 1px solid var(--line);
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  align-items: baseline;
}
.seal-head h3 { font-size: 14.5px; font-weight: 600; }
.seal-head .meta { color: var(--muted); font-size: 12.5px; font-family: var(--mono); }
.seal-body { padding: 6px 16px 14px; background: var(--ground); }

.nest {
  margin: 14px 0 4px 0;
  padding-left: 18px;
  border-left: 2px solid var(--accent);
}
.nest > .label {
  font-size: 12.5px;
  color: var(--muted);
  margin-bottom: 8px;
  display: block;
}

.check {
  display: grid;
  grid-template-columns: 74px minmax(120px, 1fr) minmax(0, 2fr);
  gap: 4px 14px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
  align-items: start;
  font-size: 13.5px;
}
.check:last-child { border-bottom: none; }
@media (max-width: 620px) { .check { grid-template-columns: 74px 1fr; } .check .detail { grid-column: 2; } }

.chip {
  font-family: var(--display);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 3px 7px;
  border-radius: 2px;
  text-align: center;
  white-space: nowrap;
}
.chip.pass { background: var(--pass-soft); color: var(--pass); }
.chip.fail { background: var(--fail-soft); color: var(--fail); }
.chip.info { background: var(--surface-2); color: var(--muted); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }

.check .name { font-weight: 500; }
.check .detail { color: var(--muted); font-family: var(--mono); font-size: 12px; word-break: break-all; }
.check .detail b { color: var(--ink); font-weight: 500; }

.attest {
  margin: 14px 0 6px;
  border: 1px solid var(--accent);
  background: var(--accent-soft);
  border-radius: 3px;
  padding: 13px 15px;
}
.attest .eyebrow { color: var(--accent); margin-bottom: 8px; display: block; }
.kv {
  display: grid;
  grid-template-columns: minmax(110px, auto) minmax(0, 1fr);
  gap: 5px 14px;
  font-size: 12.5px;
}
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--mono); word-break: break-all; }
.attest.absent { border-color: var(--fail); background: var(--fail-soft); }
.attest.absent .eyebrow { color: var(--fail); }

.note {
  margin-top: 26px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 12.5px;
  max-width: 70ch;
}
.note b { color: var(--ink); font-weight: 600; }
.empty { color: var(--muted); font-size: 14px; }
</style>

<div class="masthead">
  <h1>Seal Chain Verifier</h1>
  <span class="sub">Paste an underwriting seal. Every check below runs in your browser against the seal's own bytes — nothing is taken on trust from the page that issued it.</span>
</div>

<div class="wrap">
  <aside class="rail">
    <div>
      <span class="eyebrow">Recorded seals</span>
      <div class="samples" id="samples"></div>
    </div>
    <div>
      <span class="eyebrow">Or paste one</span>
      <textarea id="input" spellcheck="false" placeholder="{ &quot;version&quot;: 1, &quot;type&quot;: &quot;underwriting&quot;, ... }"></textarea>
    </div>
    <button class="go" id="verify">Verify seal</button>
  </aside>

  <main class="report">
    <div class="verdict idle" id="verdict">
      <h2>No seal loaded</h2>
      <p>Choose a recorded seal or paste your own.</p>
    </div>
    <div id="out"><p class="empty">The report appears here.</p></div>
    <div class="note" id="note" hidden></div>
  </main>
</div>

ptHash":"0xff524ac4abbb1ed55a0c4115d027f59ebd7492042442103ca25460f3cae5203f","responseHash":"0x0a0023fecfcdf930efcef0e390aa600e52a23d1dd06bfc6f2cf2622a7d0b18f6","teeAttestation":{"chatId":"c24e1e77-251b-4006-83bf-fe4f36353795","teeVerified":true,"teeSignerAddress":null,"signature":null,"signedTextHash":"0x0a0023fecfcdf930efcef0e390aa600e52a23d1dd06bfc6f2cf2622a7d0b18f6","signatureEndpoint":null}},"findings":[],"verdict":{"action":"ALLOW","maxLtvBps":9000},"issuedAt":1788277578,"expiresAt":1788363978,"signature":"0xb771b38bb325de7a03789f728aff6332409317d3e37d3846625823420abead36714aea09ac7e65745b6a2c5816a51fe926cc8e209fd3d6cfb30dae88963bc42d1b"},"noattest":{"version":1,"type":"audit","agentId":"2","subject":"0xdb08ce217ce842b06baf76a0bbb2c10f47ff9eb8","request":"0x24bf4661ae0be8aad50aa6c72a3ca5bb22153f58368ad3a914d62748918e5f40","inference":{"model":"qwen2.5-omni","trustMode":"verified","providerAddress":"0xa48f01287233509fd694a22bf840225062e67836","promptHash":"0xff524ac4abbb1ed55a0c4115d027f59ebd7492042442103ca25460f3cae5203f","responseHash":"0x0a0023fecfcdf930efcef0e390aa600e52a23d1dd06bfc6f2cf2622a7d0b18f6","teeAttestation":null},"findings":[],"verdict":{"action":"ALLOW","maxLtvBps":7500},"issuedAt":1788277643,"expiresAt":1788364043,"signature":"0x5e7f26a3e2cf2753f370d60c062df6f59b41effb49ce983e2a7f39d6a4496a1f3e2a8e094b16579337f280649c0c28586c44ae2b9cef5afa39bc0ef8f2a221c91b"}}</script>

<script>
(function () {
  "use strict";
  var U = ethers.utils;

  // Agents this verifier recognises. An id outside this table is reported as
  // unknown rather than quietly accepted — on-chain Agentic ID resolution is the
  // job of the [ONSITE] verifier, not of a static page.
  var KNOWN = {
    "1": { addr: "0x6ddF162A95123AaD1355E5D2FB66C2B1015Adc41", role: "Underwriter" },
    "2": { addr: "0xC1Dba83fd85838542b09ec44e6372485f6EE2D9E", role: "Code Auditor" }
  };

  // Must match packages/seal/src/canonical.ts byte for byte, or every signature
  // check here would fail for the wrong reason.
  function canonicalize(v) {
    if (v === null) return "null";
    var t = typeof v;
    if (t === "number") {
      if (!isFinite(v)) throw new Error("non-finite number");
      return JSON.stringify(v);
    }
    if (t === "string" || t === "boolean") return JSON.stringify(v);
    if (Array.isArray(v)) return "[" + v.map(canonicalize).join(",") + "]";
    if (t === "object") {
      var keys = Object.keys(v).filter(function (k) { return v[k] !== undefined; }).sort();
      return "{" + keys.map(function (k) {
        return JSON.stringify(k) + ":" + canonicalize(v[k]);
      }).join(",") + "}";
    }
    throw new Error("unsupported type " + t);
  }

  function sealDigest(seal) {
    var copy = {};
    Object.keys(seal).forEach(function (k) { if (k !== "signature") copy[k] = seal[k]; });
    return U.keccak256(U.toUtf8Bytes(canonicalize(copy)));
  }

  function recover(seal) {
    return U.verifyMessage(U.arrayify(sealDigest(seal)), seal.signature);
  }

  function eqAddr(a, b) {
    return typeof a === "string" && typeof b === "string" && a.toLowerCase() === b.toLowerCase();
  }
  function shortAddr(a) { return a ? a.slice(0, 10) + "…" + a.slice(-6) : "—"; }
  function when(ts) {
    if (!ts) return "—";
    return new Date(ts * 1000).toISOString().replace("T", " ").slice(0, 16) + "Z";
  }

  function check(state, name, detail) {
    return { state: state, name: name, detail: detail };
  }

  // --- the checks -----------------------------------------------------------

  function verifySeal(seal, kind, parentSubject) {
    var checks = [];
    var fatal = false;

    var wantType = kind === "A" ? "underwriting" : "audit";
    if (seal && seal.type === wantType && seal.version === 1) {
      checks.push(check("pass", "Shape", "version 1, type <b>" + seal.type + "</b>"));
    } else {
      checks.push(check("fail", "Shape", "expected version 1 type " + wantType));
      return { checks: checks, fatal: true };
    }

    var known = KNOWN[seal.agentId];
    if (known) {
      checks.push(check("pass", "Issuer is known", "agent " + seal.agentId + " · <b>" + known.role + "</b>"));
    } else {
      checks.push(check("fail", "Issuer is known", "agent id " + seal.agentId + " is not in this verifier's table"));
      fatal = true;
    }

    var got = null;
    try {
      got = recover(seal);
    } catch (e) {
      checks.push(check("fail", "Signature", "could not recover: " + e.message));
      fatal = true;
    }
    if (got) {
      if (known && eqAddr(got, known.addr)) {
        checks.push(check("pass", "Signature", "recovers to <b>" + shortAddr(got) + "</b>, the key agent " + seal.agentId + " claims"));
      } else {
        checks.push(check("fail", "Signature",
          "recovers to <b>" + shortAddr(got) + "</b>" +
          (known ? ", not " + shortAddr(known.addr) : "") +
          " — the seal was altered after signing, or signed by someone else"));
        fatal = true;
      }
    }

    if (kind === "B" && parentSubject) {
      if (eqAddr(seal.subject, parentSubject)) {
        checks.push(check("pass", "Subject binding", "same token as the seal above"));
      } else {
        checks.push(check("fail", "Subject binding", seal.subject + " ≠ " + parentSubject));
        fatal = true;
      }
    } else {
      checks.push(check("info", "Subject", "<b>" + seal.subject + "</b>"));
    }

    var exp = kind === "A" ? (seal.verdict && seal.verdict.expiresAt) : seal.expiresAt;
    var now = Math.floor(Date.now() / 1000);
    if (!exp) {
      checks.push(check("fail", "Expiry", "no expiry — a seal must expire"));
      fatal = true;
    } else if (exp > now) {
      checks.push(check("pass", "Not expired", "valid until <b>" + when(exp) + "</b>"));
    } else {
      checks.push(check("fail", "Expired", "expired " + when(exp) + "; a fresh audit is required"));
      fatal = true;
    }

    if (kind === "B") {
      if (seal.request) {
        checks.push(check("info", "Request binding",
          "<b>" + seal.request.slice(0, 18) + "…</b> — recomputing this needs the original request payload, which the seal does not carry"));
      }
      var att = seal.inference && seal.inference.teeAttestation;
      if (att && att.teeVerified) {
        checks.push(check("pass", "Attested inference", "TEE signature validated by the Router, chat <b>" + att.chatId + "</b>"));
      } else if (att) {
        checks.push(check("fail", "Attested inference", "attestation present but tee_verified is false"));
        fatal = true;
      } else {
        checks.push(check("fail", "Attested inference",
          "seal claims trust mode <b>" + (seal.inference ? seal.inference.trustMode : "?") +
          "</b> but carries no attestation — the auditor took the fee and skipped the verifiable part"));
        fatal = true;
      }
    }

    return { checks: checks, fatal: fatal };
  }

  // --- rendering ------------------------------------------------------------

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  function renderChecks(list) {
    var frag = document.createDocumentFragment();
    list.forEach(function (c) {
      var row = el("div", "check");
      row.appendChild(el("span", "chip " + c.state, c.state === "info" ? "note" : c.state));
      row.appendChild(el("span", "name", c.name));
      row.appendChild(el("span", "detail", c.detail));
      frag.appendChild(row);
    });
    return frag;
  }

  function renderAttestation(inf) {
    var att = inf && inf.teeAttestation;
    var box = el("div", "attest" + (att ? "" : " absent"));
    box.appendChild(el("span", "eyebrow", att ? "Attestation" : "No attestation"));
    var dl = el("dl", "kv");
    function row(k, v) {
      dl.appendChild(el("dt", null, k));
      dl.appendChild(el("dd", null, v));
    }
    row("Model", inf.model);
    row("Trust mode", inf.trustMode);
    row("Provider", inf.providerAddress);
    if (att) {
      row("Chat id", att.chatId);
      row("tee_verified", String(att.teeVerified));
      row("Response hash", att.signedTextHash || "—");
    } else {
      row("Evidence", "none — this seal asserts an attested tier it cannot show");
    }
    row("Prompt hash", inf.promptHash);
    box.appendChild(dl);
    return box;
  }

  function sealCard(seal, kind, parentSubject) {
    var res = verifySeal(seal, kind, parentSubject);
    var card = el("div", "seal");

    var head = el("div", "seal-head");
    var title = kind === "A" ? "Seal A — underwriting" : "Seal B — code audit";
    head.appendChild(el("h3", null, title));
    var v = seal.verdict || {};
    head.appendChild(el("span", "meta", v.action + " · maxLtvBps " + v.maxLtvBps + " · agent " + seal.agentId));
    card.appendChild(head);

    var body = el("div", "seal-body");
    body.appendChild(renderChecks(res.checks));

    if (kind === "B" && seal.inference) body.appendChild(renderAttestation(seal.inference));

    var anyFatal = res.fatal;

    if (kind === "A" && Array.isArray(seal.delegations)) {
      seal.delegations.forEach(function (d) {
        var nest = el("div", "nest");
        nest.appendChild(el("span", "label",
          "hired agent " + d.agentId + " for " + d.service + " · paid " + d.priceAtomic +
          " on " + d.network + (d.settlementTx ? " · settled " + d.settlementTx.slice(0, 14) + "…" : "")));
        var inner = sealCard(d.seal, "B", seal.subject);
        nest.appendChild(inner.node);
        body.appendChild(nest);
        if (inner.fatal) anyFatal = true;
      });
    }

    card.appendChild(body);
    return { node: card, fatal: anyFatal, checks: res.checks };
  }

  // --- driver ---------------------------------------------------------------

  var out = document.getElementById("out");
  var verdict = document.getElementById("verdict");
  var note = document.getElementById("note");
  var input = document.getElementById("input");

  function setVerdict(cls, h, p) {
    verdict.className = "verdict " + cls;
    verdict.innerHTML = "";
    verdict.appendChild(el("h2", null, h));
    verdict.appendChild(el("p", null, p));
  }

  function run(text) {
    var seal;
    try {
      seal = JSON.parse(text);
    } catch (e) {
      setVerdict("bad", "Not valid JSON", e.message);
      out.innerHTML = "";
      note.hidden = true;
      return;
    }
    var kind = seal.type === "audit" ? "B" : "A";
    var r = sealCard(seal, kind, null);
    out.innerHTML = "";
    out.appendChild(r.node);

    if (r.fatal) {
      setVerdict("bad", "Seal rejected",
        "At least one check failed. An underwriter running these same checks would refuse to act on this seal — which is the point: nothing here depends on trusting whoever handed it to you.");
    } else {
      setVerdict("ok", "Seal verified",
        "Every check passed, including the audit seal embedded one level down. The chain holds.");
    }

    note.hidden = false;
    note.innerHTML =
      "<b>What this page proves, and what it does not.</b> It recomputes each seal's digest from its own " +
      "bytes and recovers the signer, so any alteration after signing shows up here. It does not prove the " +
      "judgement was correct — a perfectly signed wrong answer still verifies. Two checks need data a seal " +
      "does not carry: the request binding needs the original request, and confirming the agent id against a " +
      "live Agentic ID needs a chain read.";
  }

  var EX = JSON.parse(document.getElementById("examples").textContent);
  var SAMPLES = [
    { key: "sealA", t: "Seal A — CleanUSD", d: "A full chain: underwriting seal wrapping the audit seal it paid for." },
    { key: "noattest", t: "Seal B — auditor skipped the proof", d: "Claims an attested tier, carries no attestation." },
    { key: "tampered", t: "Seal B — verdict rewritten in flight", d: "A proxy raised the cap to 9000 and left the signature alone." }
  ];

  var rail = document.getElementById("samples");
  SAMPLES.forEach(function (s) {
    var b = el("button", "sample");
    b.type = "button";
    b.setAttribute("aria-pressed", "false");
    b.appendChild(el("span", "t", s.t));
    b.appendChild(el("span", "d", s.d));
    b.addEventListener("click", function () {
      Array.prototype.forEach.call(rail.children, function (c) { c.setAttribute("aria-pressed", "false"); });
      b.setAttribute("aria-pressed", "true");
      input.value = JSON.stringify(EX[s.key], null, 2);
      run(input.value);
    });
    rail.appendChild(b);
  });

  document.getElementById("verify").addEventListener("click", function () {
    if (input.value.trim()) run(input.value);
  });

  rail.children[0].click();
})();
</script>
